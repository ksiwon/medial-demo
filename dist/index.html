<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEDial — 데모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<style>
  :root{
    --navy:#1A3A5C;
    --navy-deep:#102A44;
    --bg:#081320;
    --bg2:#0C1B2C;
    --teal:#1D9E75;
    --teal-soft:#E5F4EE;
    --blue:#1FA8DC;
    --amber:#E8941A;
    --amber-soft:#FCEFD8;
    --chat-bg:#EEF3F7;
    --white:#FFFFFF;
    --ink:#1B2733;
    --ink-soft:#5B6B7A;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:
      radial-gradient(120% 90% at 50% -10%, #12273E 0%, var(--bg) 60%, #050C15 100%);
    font-family:'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color:#fff;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #root{ width:100vw; height:100vh; }
  .viewport{ position:fixed; inset:0; display:flex; flex-direction:column; }
  .stagearea{ flex:1 1 auto; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; }
  .sizer{ position:relative; flex:0 0 auto; }
  .stage{
    width:1920px; height:1080px; position:absolute; top:0; left:0;
    transform-origin:top left;
    background-image: 
      radial-gradient(rgba(255,255,255,0.03) 1.5px, transparent 1.5px),
      linear-gradient(rgba(255,255,255,0.005) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.005) 1px, transparent 1px);
    background-size: 24px 24px, 120px 120px, 120px 120px;
    background-position: center;
  }

  /* ---------- header ---------- */
  .topbar{ position:absolute; top:27px; left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .brand{ display:flex; align-items:center; gap:16px; }
  .brand img{ width:66px; height:66px; object-fit:contain; filter:drop-shadow(0 6px 18px rgba(0,0,0,.4)); }
  .brand .wm{ font-size:42px; font-weight:800; letter-spacing:-.02em; }
  .brand .wm b{ color:var(--teal); }
  .tagline{ font-size:19px; color:#90A6BD; font-weight:500; letter-spacing:.01em; }

  /* ---------- phones row ---------- */
  .phones{ position:absolute; top:179px; left:0; right:0; display:flex; justify-content:center; align-items:flex-start; gap:40px; }
  .col{ display:flex; flex-direction:column; align-items:center; gap:20px; }

  .role{ display:flex; flex-direction:row; align-items:center; justify-content:center; gap:14px; transition:opacity .5s ease, transform .5s ease; }
  .role .chip{ display:inline-flex; align-items:center; gap:11px; padding:9px 22px 9px 14px; border-radius:999px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.10); }
  .role .dot{ width:14px; height:14px; border-radius:50%; background:#42546A; transition:all .4s ease; }
  .role .name{ font-size:24px; font-weight:700; letter-spacing:-.01em; }
  .role .sub{ font-size:16px; color:#8DA2B8; font-weight:500; }
  .role .status{ font-size:15px; font-weight:600; color:#5E7286; opacity:0; height:0; transition:opacity .4s; }
  .col.idle .role{ opacity:.4; }
  .col.live .role .dot{ box-shadow:0 0 0 5px rgba(29,158,117,.18); }
  .col.live.elder .role .dot{ background:var(--teal); }
  .col.live.doctor .role .dot{ background:var(--blue); box-shadow:0 0 0 5px rgba(31,168,220,.18); }

  /* ---------- phone frame ---------- */
  .phone{
    width:396px; height:812px; border-radius:54px; padding:13px;
    background:linear-gradient(155deg,#1c1c20,#070708);
    box-shadow:0 40px 80px -20px rgba(0,0,0,.7), 0 0 0 2px rgba(255,255,255,.04) inset;
    position:relative; transition:filter .6s ease, transform .55s cubic-bezier(.4,0,.2,1), box-shadow .6s ease;
  }
  .col.idle .phone{ filter:grayscale(1) brightness(.74); transform:scale(.965); }
  .col.live .phone{ filter:none; transform:scale(1); }
  .col.live.elder .phone{ box-shadow:0 40px 90px -18px rgba(0,0,0,.7), 0 0 0 2px rgba(29,158,117,.5) inset, 0 0 60px -4px rgba(29,158,117,.45); }
  .col.live.doctor .phone{ box-shadow:0 40px 90px -18px rgba(0,0,0,.7), 0 0 0 2px rgba(31,168,220,.5) inset, 0 0 60px -4px rgba(31,168,220,.4); }

  .screen{ position:relative; width:100%; height:100%; border-radius:42px; overflow:hidden; background:var(--chat-bg); }
  .island{ position:absolute; top:14px; left:50%; transform:translateX(-50%); width:108px; height:30px; background:#000; border-radius:18px; z-index:40; }

  /* status bar */
  .statusbar{ position:absolute; top:0; left:0; right:0; height:54px; display:flex; align-items:center; justify-content:space-between;
    padding:18px 30px 0; font-size:16px; font-weight:700; z-index:30; color:var(--ink); }
  .statusbar .sig{ display:flex; align-items:center; gap:7px; }
  .statusbar .bars{ display:flex; align-items:flex-end; gap:2px; height:13px; }
  .statusbar .bars i{ width:3px; background:currentColor; border-radius:1px; }
  .statusbar .batt{ width:24px; height:12px; border:1.6px solid currentColor; border-radius:3px; position:relative; }
  .statusbar .batt:after{ content:""; position:absolute; left:1.5px; top:1.5px; bottom:1.5px; width:70%; background:currentColor; border-radius:1px; }
  .statusbar .batt:before{ content:""; position:absolute; right:-3px; top:3px; height:6px; width:2px; background:currentColor; border-radius:1px; }
  .screen.dark .statusbar{ color:#fff; }

  /* ===== ELDER HOME ===== */
  .home{ position:absolute; inset:0; background:linear-gradient(170deg,#1E456B 0%, #15324E 52%, #0F2740 100%);
    display:flex; flex-direction:column; align-items:center; color:#fff; padding:96px 34px 60px; }
  .home .hello{ font-size:23px; color:#A9C4DD; font-weight:600; }
  .home .hname{ font-size:34px; font-weight:800; margin-top:4px; letter-spacing:-.02em; }
  .home .prompt{ font-size:21px; color:#C6D8E8; margin-top:14px; text-align:center; line-height:1.5; }
  .home .big{ margin-top:auto; margin-bottom:18px; display:flex; flex-direction:column; align-items:center; gap:26px; }
  .home .bigbtn{ width:200px; height:200px; border-radius:50%; background:radial-gradient(circle at 38% 32%, #2BC08F, #1D9E75 64%, #16805f);
    display:flex; align-items:center; justify-content:center; color:#fff; position:relative;
    box-shadow:0 22px 44px -10px rgba(29,158,117,.6), 0 0 0 10px rgba(29,158,117,.14); }
  .home .bigbtn svg{ width:88px; height:88px; }
  .home .bigbtn .ring{ position:absolute; inset:0; border-radius:50%; border:3px solid rgba(43,192,143,.5); animation:ripple 2.6s ease-out infinite; }
  .home .bigbtn .ring:nth-child(2){ animation-delay:1.3s; }
  .home .biglabel{ font-size:26px; font-weight:800; letter-spacing:-.01em; }
  @keyframes ripple{ 0%{ transform:scale(1); opacity:.7; } 100%{ transform:scale(1.45); opacity:0; } }

  /* ===== CHAT ===== */
  .chat{ position:absolute; inset:0; display:flex; flex-direction:column; background:var(--chat-bg); }
  .chathead{ height:116px; flex:0 0 auto; padding:54px 24px 8px; display:flex; align-items:center; gap:13px;
    background:#fff; border-bottom:1px solid #E3EAF1; z-index:20; }
  .chathead .av{ width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .chathead .av.ai{ background:linear-gradient(145deg,#2BC08F,#16805f); color:#fff; font-weight:800; font-size:20px; }
  .chathead .av.dr{ background:linear-gradient(145deg,#2C6FA8,#1A3A5C); color:#fff; }
  .chathead .who{ font-size:21px; font-weight:800; color:var(--ink); }
  .chathead .where{ font-size:14px; color:var(--ink-soft); font-weight:600; }
  .chathead .live{ margin-left:auto; display:flex; align-items:center; gap:7px; font-size:14px; font-weight:700; color:var(--teal); }
  .chathead .live i{ width:9px; height:9px; border-radius:50%; background:var(--teal); animation:blink 1.1s infinite; }
  @keyframes blink{ 50%{ opacity:.25; } }

  .scroll{ flex:1 1 auto; overflow:hidden; padding:22px 20px 30px; display:flex; flex-direction:column; gap:16px; }

  .row{ display:flex; max-width:100%; animation:pop .42s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes pop{ from{ transform:translateY(16px) scale(.96); } to{ transform:none; } }
  .row.right{ justify-content:flex-end; }
  .row.left{ justify-content:flex-start; }
  .bubble{ max-width:100%; padding:14px 18px; font-size:19px; line-height:1.46; font-weight:600; letter-spacing:-.01em;
    border-radius:24px; word-break:keep-all; width:fit-content; }
  .bubble.elder{ background:#fff; color:var(--ink); border-bottom-right-radius:8px; box-shadow:0 2px 8px rgba(20,40,60,.07); }
  .bubble.ai{ background:linear-gradient(160deg,#22A87E,#1A8F69); color:#fff; border-bottom-left-radius:8px; box-shadow:0 6px 16px -4px rgba(29,158,117,.4); }
  .bubble.doctor{ background:linear-gradient(160deg,#235A8C,#1A3A5C); color:#fff; border-bottom-right-radius:8px; box-shadow:0 6px 16px -4px rgba(26,58,92,.4); }
  .bubble .thumb{ margin-top:11px; width:100%; border-radius:14px; display:block; }
  .meta{ font-size:13px; color:#9AABBC; font-weight:600; margin:2px 4px 0; }
  .row.left .meta{ text-align:left; }
  .row.right .meta{ text-align:right; }
  .bcol{ display:flex; flex-direction:column; max-width:82%; }

  /* typing */
  .typing{ display:inline-flex; gap:6px; padding:18px 20px; background:linear-gradient(160deg,#22A87E,#1A8F69); border-radius:24px; border-bottom-left-radius:8px; }
  .typing i{ width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,.9); animation:td 1s infinite; }
  .typing i:nth-child(2){ animation-delay:.18s; } .typing i:nth-child(3){ animation-delay:.36s; }
  @keyframes td{ 0%,60%,100%{ transform:translateY(0); opacity:.5; } 30%{ transform:translateY(-6px); opacity:1; } }

  /* listening / mic */
  .micwrap{ position:absolute; left:50%; transform:translateX(-50%); bottom:24px; z-index:25; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .listening{ display:flex; align-items:center; gap:11px; background:#fff; padding:11px 18px; border-radius:999px;
    box-shadow:0 8px 22px -6px rgba(20,40,60,.22); font-size:16px; font-weight:700; color:var(--teal); }
  .wave{ display:flex; align-items:center; gap:3px; height:22px; }
  .wave i{ width:4px; border-radius:2px; background:var(--teal); animation:wv .9s ease-in-out infinite; }
  .wave i:nth-child(1){ animation-delay:0s } .wave i:nth-child(2){ animation-delay:.12s } .wave i:nth-child(3){ animation-delay:.24s }
  .wave i:nth-child(4){ animation-delay:.36s } .wave i:nth-child(5){ animation-delay:.18s }
  @keyframes wv{ 0%,100%{ height:6px } 50%{ height:22px } }
  .mic{ width:96px; height:96px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff;
    background:radial-gradient(circle at 38% 32%, #2BC08F, #1D9E75 66%, #16805f); position:relative; }
  .mic svg{ width:42px; height:42px; }
  .mic.on{ box-shadow:0 0 0 10px rgba(29,158,117,.16), 0 14px 30px -8px rgba(29,158,117,.6); }
  .mic.on .pr{ position:absolute; inset:0; border-radius:50%; border:3px solid rgba(29,158,117,.55); animation:ripple 2.1s ease-out infinite; }
  .mic.on .pr:nth-child(2){ animation-delay:1.05s; }
  .mic.off{ background:#fff; color:var(--teal); box-shadow:0 8px 22px -6px rgba(20,40,60,.22); }

  /* ===== DOCTOR ===== */
  .docidle{ position:absolute; inset:0; background:linear-gradient(180deg,#16324E,#0F2740); color:#fff; display:flex; flex-direction:column; padding:74px 26px 30px; }
  .docidle .dh{ font-size:15px; color:#8FB0CC; font-weight:700; letter-spacing:.04em; }
  .docidle .dt{ font-size:27px; font-weight:800; margin-top:6px; letter-spacing:-.01em; }
  .docidle .grid{ margin-top:22px; display:grid; grid-template-columns:1fr 1fr; gap:13px; }
  .docidle .stat{ background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.09); border-radius:18px; padding:17px 16px; }
  .docidle .stat .n{ font-size:34px; font-weight:800; }
  .docidle .stat .n.tl{ color:#46D6A6; }
  .docidle .stat .l{ font-size:15px; color:#9DB6CE; font-weight:600; margin-top:3px; }
  .docidle .empty{ margin-top:auto; margin-bottom:auto; text-align:center; color:#7E99B4; }
  .docidle .empty .ic{ width:78px; height:78px; border-radius:50%; border:2px dashed rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
  .docidle .empty .ic svg{ width:34px; height:34px; opacity:.6; }
  .docidle .empty p{ font-size:18px; font-weight:600; }

  .alert{ display:flex; align-items:center; gap:13px; background:linear-gradient(160deg,#F4A62A,#E8941A); color:#fff; padding:16px 18px; border-radius:20px;
    box-shadow:0 10px 24px -8px rgba(232,148,26,.5); }
  .alert .ico{ width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,.22); display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .alert .ico svg{ width:24px; height:24px; }
  .alert .t{ font-size:20px; font-weight:800; }
  .alert .s{ font-size:14px; font-weight:600; opacity:.92; }
  .alert .badge{ margin-left:auto; font-size:13px; font-weight:700; background:rgba(255,255,255,.22); padding:5px 11px; border-radius:999px; white-space:nowrap; flex-shrink:0; }

  .report{ background:#fff; border-radius:22px; padding:20px; box-shadow:0 4px 14px rgba(20,40,60,.08); border:1px solid #E6EDF4; }
  .report .head{ display:flex; align-items:center; gap:11px; padding-bottom:14px; border-bottom:1px solid #EDF2F7; }
  .report .pic{ width:54px; height:54px; border-radius:14px; object-fit:cover; flex:0 0 auto; }
  .report .pt{ font-size:22px; font-weight:800; color:var(--ink); }
  .report .pp{ font-size:15px; color:var(--ink-soft); font-weight:600; }
  .report ul{ list-style:none; margin-top:14px; display:flex; flex-direction:column; gap:12px; }
  .report li{ display:flex; align-items:center; gap:11px; font-size:19px; font-weight:600; color:var(--ink); }
  .report li .d{ width:9px; height:9px; border-radius:50%; background:var(--teal); flex:0 0 auto; }
  .report li.warn .d{ background:var(--amber); }
  .report .ai{ margin-top:15px; font-size:14px; color:var(--teal); font-weight:700; display:flex; align-items:center; gap:7px; }

  .docinput{ flex:0 0 auto; padding:14px 18px 24px; background:#fff; border-top:1px solid #E3EAF1; display:flex; align-items:center; gap:12px; }
  .docinput .field{ flex:1 1 auto; min-height:52px; background:#EEF3F7; border-radius:26px; padding:14px 20px; font-size:19px; font-weight:600; color:var(--ink); display:flex; align-items:center; }
  .docinput .field .ph{ color:#9AABBC; }
  .docinput .caret{ display:inline-block; width:2px; height:22px; background:var(--navy); margin-left:1px; animation:blink .9s steps(1) infinite; vertical-align:middle; }
  .docinput .send{ width:52px; height:52px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center; color:#fff;
    background:linear-gradient(160deg,#235A8C,#1A3A5C); }
  .docinput .send.hot{ box-shadow:0 0 0 6px rgba(31,168,220,.18); }
  .docinput .send svg{ width:24px; height:24px; }

  /* booking card */
  .booking{ background:linear-gradient(160deg,#1E456B,#14304C); color:#fff; border-radius:24px; padding:18px 20px; box-shadow:0 12px 30px -10px rgba(0,0,0,.4); }
  .booking .top{ display:flex; align-items:center; gap:10px; }
  .booking .ck{ width:42px; height:42px; border-radius:50%; background:var(--teal); display:flex; align-items:center; justify-content:center; flex:0 0 auto; box-shadow:0 0 0 5px rgba(29,158,117,.2); }
  .booking .ck svg{ width:22px; height:22px; color:#fff; }
  .booking .bt{ font-size:18px; font-weight:800; line-height:1.35; word-break:keep-all; }
  .booking .when{ margin-top:14px; padding-top:14px; border-top:1px solid rgba(255,255,255,.14); display:flex; flex-direction:column; gap:4px; }
  .booking .when .dl{ font-size:13px; color:#A9C4DD; font-weight:600; }
  .booking .when .dv{ font-size:18px; font-weight:800; white-space:nowrap; }

  .syschip{ align-self:center; background:rgba(29,158,117,.12); color:#15805f; border:1px solid rgba(29,158,117,.25);
    font-size:15px; font-weight:700; padding:8px 16px; border-radius:999px; }

  /* ---------- controls ---------- */
  .ctlbar{ flex:0 0 auto; display:flex; justify-content:center; padding:0 0 14px; }
  .controls{ z-index:100;
    display:flex; align-items:center; gap:12px; background:rgba(10,20,32,.82); backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.10); border-radius:999px; padding:7px 12px; box-shadow:0 18px 40px -12px rgba(0,0,0,.6); }
  .ctlbtn{ width:34px; height:34px; border-radius:50%; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.08); color:#fff; transition:background .2s; }
  .ctlbtn:hover{ background:rgba(255,255,255,.16); }
  .ctlbtn.play{ background:var(--teal); width:38px; height:38px; }
  .ctlbtn.play:hover{ background:#22b083; }
  .ctlbtn svg{ width:16px; height:16px; }
  .track{ width:240px; height:5px; border-radius:4px; background:rgba(255,255,255,.14); cursor:pointer; position:relative; overflow:hidden; }
  .track .fill{ position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg,var(--blue),var(--teal)); border-radius:4px; transition:width .25s linear; }
  .scene{ font-size:13px; font-weight:700; color:#B9C8D8; min-width:100px; }
  .scene b{ color:#fff; }

  /* ---------- AI Orchestrator Panel ---------- */
  .orchestrator-panel {
    width: 480px;
    height: 812px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: relative;
  }

  /* Exhibition Floating Glass Card Modules */
  .orch-module {
    background: rgba(10, 22, 38, 0.45);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: none;
    border-radius: 14px;
    padding: 18px 20px;
    position: relative;
    display: flex;
    flex-direction: column;
    transition: box-shadow 0.5s ease;
  }

  /* Active pulsing neon colors based on cycle state */
  .orch-module.pulse-teal {
    box-shadow: 0 0 20px -5px rgba(29, 158, 117, 0.15), 0 0 40px -10px rgba(29, 158, 117, 0.05);
  }
  .orch-module.pulse-blue {
    box-shadow: 0 0 20px -5px rgba(31, 168, 220, 0.15), 0 0 40px -10px rgba(31, 168, 220, 0.05);
  }
  .orch-module.pulse-amber {
    box-shadow: 0 0 20px -5px rgba(232, 148, 26, 0.15), 0 0 40px -10px rgba(232, 148, 26, 0.05);
  }


  .orch-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    padding-bottom: 14px;
    flex-shrink: 0;
  }
  .orch-status-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.07);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.05em;
    color: #8DA2B8;
  }
  .orch-status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4A5568;
    transition: all 0.4s ease;
  }
  .orch-status-dot.teal {
    background: var(--teal);
    box-shadow: 0 0 8px var(--teal);
    animation: orch-dot-blink 1s infinite alternate;
  }
  .orch-status-dot.blue {
    background: var(--blue);
    box-shadow: 0 0 8px var(--blue);
    animation: orch-dot-blink 1s infinite alternate;
  }
  .orch-status-dot.amber {
    background: var(--amber);
    box-shadow: 0 0 8px var(--amber);
    animation: orch-dot-blink 1s infinite alternate;
  }
  @keyframes orch-dot-blink {
    0% { opacity: 0.5; }
    100% { opacity: 1; }
  }
  .orch-status-text {
    font-size: 24px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.01em;
  }

  .orch-cycle {
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    padding: 12px 14px;
    background: rgba(255, 255, 255, 0.02);
    border-radius: 18px;
    border: 1px solid rgba(255, 255, 255, 0.04);
    flex-shrink: 0;
  }
  .orch-cycle-line-container {
    position: absolute;
    left: 47px;
    right: 47px;
    height: 2px;
    top: 29px;
    transform: translateY(-50%);
    z-index: 0;
  }
  .orch-cycle-line {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    background: rgba(255, 255, 255, 0.06);
  }
  .orch-cycle-line-progress {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    background: linear-gradient(90deg, var(--teal), var(--blue));
    z-index: 1;
    transition: width 0.6s ease;
  }
  .orch-cycle-node {
    position: relative;
    width: 66px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 2;
  }
  .orch-cycle-dot {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #0D1622;
    border: 1.5px solid #233346;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 800;
    color: #4A5A6A;
    transition: all 0.4s ease;
  }
  .orch-cycle-node.active .orch-cycle-dot {
    background: var(--teal);
    border-color: #2BC08F;
    color: #fff;
    box-shadow: 0 0 12px rgba(43, 192, 143, 0.4);
    transform: scale(1.1);
  }
  .orch-cycle-node.active.blue .orch-cycle-dot {
    background: var(--blue);
    border-color: #5ac8fa;
    box-shadow: 0 0 12px rgba(31, 168, 220, 0.4);
  }
  .orch-cycle-node.active.amber .orch-cycle-dot {
    background: var(--amber);
    border-color: #fcd34d;
    box-shadow: 0 0 12px rgba(232, 148, 26, 0.4);
  }
  .orch-cycle-label {
    font-size: 13px;
    font-weight: 700;
    color: #5E6D7E;
    transition: color 0.4s;
  }
  .orch-cycle-node.active .orch-cycle-label {
    color: #fff;
  }

  .orch-cdss {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
    overflow: hidden;
  }
  .orch-kb-box {
    background: rgba(255, 255, 255, 0.01);
    border: 1px solid rgba(255, 255, 255, 0.04);
    border-radius: 18px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .orch-kb-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 15px;
    font-weight: 700;
    color: #8DA2B8;
    line-height: 28px;
  }
  .orch-kb-chips {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 10px;
    margin: 6px 0;
  }
  .orch-kb-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 28px;
    padding: 0 12px;
    margin: 4px 0;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    font-size: 12px;
    font-weight: 700;
    color: #8DA2B8;
    transition: all 0.4s ease;
    box-sizing: border-box;
    line-height: 1;
  }
  .orch-kb-chip.active {
    background: rgba(29, 158, 117, 0.2);
    border-color: #2BC08F;
    color: #fff;
    box-shadow: 0 0 10px rgba(43, 192, 143, 0.3);
  }
  .orch-kb-chip.active.blue {
    background: rgba(31, 168, 220, 0.2);
    border-color: #5ac8fa;
    color: #fff;
    box-shadow: 0 0 10px rgba(90, 200, 250, 0.3);
  }
  .orch-kb-chip.active.amber {
    background: rgba(232, 148, 26, 0.2);
    border-color: #fcd34d;
    color: #fff;
    box-shadow: 0 0 10px rgba(252, 211, 77, 0.3);
  }

  .orch-rag-query {
    background: rgba(0, 0, 0, 0.15);
    border: 1px dashed rgba(255, 255, 255, 0.06);
    padding: 8px 12px;
    border-radius: 8px;
    font-family: monospace;
    font-size: 13px;
    color: #2BC08F;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .orch-disease-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .orch-disease-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, 0.02);
    padding: 10px 14px;
    border-radius: 10px;
    border-left: 3px solid transparent;
    transition: all 0.3s ease;
    animation: pop .3s cubic-bezier(.2,.8,.2,1) both;
  }
  .orch-disease-item.high {
    border-left-color: var(--amber);
    background: rgba(232, 148, 26, 0.03);
  }
  .orch-disease-item.med {
    border-left-color: var(--blue);
    background: rgba(31, 168, 220, 0.02);
  }
  .orch-disease-name {
    font-size: 16px;
    font-weight: 700;
    color: #E2E8F0;
  }
  .orch-disease-score {
    font-size: 14px;
    font-weight: 800;
    color: var(--amber);
  }
  .orch-disease-score.med {
    color: var(--blue);
  }

  .orch-dashboard-summary {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.04);
    border-radius: 14px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    animation: pop .3s ease both;
  }
  .orch-dashboard-title {
    font-size: 13px;
    font-weight: 800;
    color: #8DA2B8;
    text-transform: uppercase;
  }
  .orch-dashboard-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .orch-dashboard-cell {
    background: rgba(0,0,0,0.12);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
  }
  .orch-dashboard-cell span {
    color: #5E6D7E;
    display: block;
    font-size: 12px;
    margin-bottom: 2px;
  }
  .orch-dashboard-cell b {
    color: #fff;
    font-weight: 700;
  }

  /* Premium Log Feed (Activity Log) */
  .orch-terminal {
    height: 190px;
    background: rgba(5, 12, 22, 0.6);
    border: 1.5px solid rgba(255, 255, 255, 0.05);
    border-radius: 20px;
    padding: 16px;
    font-family: 'Pretendard Variable', -apple-system, sans-serif;
    font-size: 12.5px;
    line-height: 1.6;
    color: #E2E8F0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .orch-log-line {
    display: flex;
    align-items: flex-start;
    animation: pop .2s ease both;
  }
  .orch-log-time {
    color: #5E6D7E;
    font-size: 11px;
    margin-right: 8px;
    font-family: monospace;
    margin-top: 2.5px;
  }
  .orch-log-tag {
    font-size: 10px;
    font-weight: 800;
    padding: 2.5px 7px;
    border-radius: 6px;
    margin-right: 8px;
    display: inline-block;
    letter-spacing: 0.05em;
    flex-shrink: 0;
    line-height: 1;
    margin-top: 1.5px;
  }
  .orch-log-tag.tag-system { color: #8DA2B8; background: rgba(141, 162, 184, 0.1); }
  .orch-log-tag.tag-stt { color: #E8941A; background: rgba(232, 148, 26, 0.1); }
  .orch-log-tag.tag-vision { color: #C084FC; background: rgba(168, 85, 247, 0.1); }
  .orch-log-tag.tag-cdss { color: #38BDF8; background: rgba(31, 168, 220, 0.1); }
  .orch-log-tag.tag-translator { color: #34D399; background: rgba(43, 192, 143, 0.1); }
  .orch-log-tag.tag-booking { color: #F472B6; background: rgba(236, 72, 153, 0.1); }
  .orch-log-text {
    color: #CBD5E1;
    word-break: break-all;
  }
</style>
</head>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
